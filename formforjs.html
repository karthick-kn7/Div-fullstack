<!DOCTYPE html>
<html>
	<head>
		<title>Form</title>

   <script>
	   function validate() {
      let x=document.getElementById('leo').value;
			let msg=document.getElementById('msg');
			const r = /^[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.[a-zA-Z]{1,}$/;
		if(r.test(x))
		   {
				msg.textContent="valid";
				msg.style.color="green";
			 }
			 else{

				msg.textContent="invalid";
				msg.style.color="red";

			 }
			
		 }

	 </script>
	</head>

	<body>
		

      <center>
			E-mail:<input type="email"   id="leo" placeholder="enter your email"><br><br>
      
			<button onclick="return validate()">Submit</button>
			<div id="msg"></div>
		</center>

			
			
		
	</body>
</html>
